syntax = "proto3";

service AnalyticsService {
  rpc PrimeSuspects (PrimeSuspectsRequest) returns (PrimeSuspectsResponse);
  rpc MostActivePerson (Empty) returns (MostActivePersonResponse);
  rpc TopDefaulter (Empty) returns (TopDefaulterResponse);
}

message Empty {}

message PrimeSuspectsRequest {
  int32 apartment_id = 1;
  string crime_from = 2;
  string crime_to = 3;
}

message Suspect {
  string rfid = 1;
  string person_type = 2;
  string name = 3;
  string entered_at = 4;
  string exited_at = 5;
  int32 duration_inside_minutes = 6;
}

message PrimeSuspectsResponse {
  int32 apartment_id = 1;
  int32 suspect_count = 2;
  repeated Suspect prime_suspects = 3;
}

message MostActivePersonResponse {
  string rfid = 1;
  string person_type = 2;
  string name = 3;
  int32 total_entries = 4;
}

message ResidentInfo {
  int32 id = 1;
  string name = 2;
}

message TopDefaulterResponse {
  int32 apartment_id = 1;
  repeated ResidentInfo residents = 2;
  int32 total_defaults = 3;
}

